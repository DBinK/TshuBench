name: Verify Run PR

on:
  pull_request:
    paths:
      - "runs/**/*.jsonl"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Unit Tests
        run: uv run pytest

      - name: Validate Added Runs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          STATUS_LINES=$(git diff --name-status origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$STATUS_LINES"

          # 1. Only allow adding new .jsonl files under runs/
          while IFS=$'\t' read -r st file; do
            if [ "$st" != "A" ]; then
              echo "::error::PR 只允许新增样本文件，禁止修改或删除已有文件：$st $file"
              exit 1
            fi
            if [[ "$file" != runs/*.jsonl ]]; then
              echo "::error::PR 只允许在 runs/ 目录下提交 .jsonl 文件，检测到越权改动：$file"
              exit 1
            fi
          done <<< "$STATUS_LINES"

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # 2. Validate each changed jsonl file has all 36 tasks and passes tshu score
          mkdir -p /tmp/pr_check
          echo "### 🤖 TshuBench 自动化校验报告" > /tmp/pr_check/comment.md
          echo "" >> /tmp/pr_check/comment.md

          for f in $CHANGED; do
            if [[ "$f" == *.jsonl ]]; then
              uv run python -c "from tshu.score import load_tasks, load_samples_grouped; tasks = load_tasks('tasks/eval_suite_v2.jsonl'); grouped = load_samples_grouped(['$f']); assert grouped, '$f 没有有效样本'; [print(f'OK: {m} ({e}) -> {len({s.task_id for s in ss if s.task_id in tasks})}/36') for (m, e), ss in grouped.items()]; assert all(not (set(tasks) - {s.task_id for s in ss if s.task_id in tasks}) for ss in grouped.values()), '缺少题目'"
              uv run tshu score "$f" --out /tmp/pr_check/out --html /tmp/pr_check/index.html
              cat /tmp/pr_check/out/report.md >> /tmp/pr_check/comment.md
            fi
          done

      - name: Post Report Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_check/comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
