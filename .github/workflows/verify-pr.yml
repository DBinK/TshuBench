name: Verify Run PR

on:
  pull_request:
    paths:
      - "runs/**/*.jsonl"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Unit Tests
        run: uv run pytest

      - name: Validate Added Runs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          STATUS_LINES=$(git diff --name-status origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$STATUS_LINES"

          # 1. Only allow adding new .jsonl files under runs/
          while IFS=$'\t' read -r st file; do
            if [ "$st" != "A" ]; then
              echo "::error::PR 只允许新增样本文件，禁止修改或删除已有文件：$st $file"
              exit 1
            fi
            if [[ "$file" != runs/*.jsonl ]]; then
              echo "::error::PR 只允许在 runs/ 目录下提交 .jsonl 文件，检测到越权改动：$file"
              exit 1
            fi
          done <<< "$STATUS_LINES"

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # 2. Validate each changed jsonl file has all 36 tasks and passes tshu score
          mkdir -p /tmp/pr_check
          echo "### 🤖 TshuBench 自动化校验报告" > /tmp/pr_check/comment.md
          echo "" >> /tmp/pr_check/comment.md

          for f in $CHANGED; do
            if [[ "$f" == *.jsonl ]]; then
              uv run python -c "from tshu.score import load_tasks, load_samples_grouped; tasks = load_tasks('tasks/eval_suite_v2.jsonl'); grouped = load_samples_grouped(['$f']); assert grouped, '$f 没有有效样本'; [print(f'OK: {m} ({e}) -> {len({s.task_id for s in ss if s.task_id in tasks})}/36') for (m, e), ss in grouped.items()]; assert all(not (set(tasks) - {s.task_id for s in ss if s.task_id in tasks}) for ss in grouped.values()), '缺少题目'"
              uv run tshu score "$f" --out /tmp/pr_check/out --html /tmp/pr_check/index.html
              uv run python - << 'PY' >> /tmp/pr_check/comment.md
              import re
              from pathlib import Path

              text = Path('/tmp/pr_check/out/report.md').read_text(encoding='utf-8')
              lines = text.splitlines()

              row = next((ln for ln in lines if ln.startswith('| 1 |')), None)
              if row:
                  cols = [c.strip() for c in row.strip('|').split('|')]
                  print(f"#### `{cols[1]}` (`{cols[2]}`)\n")
                  print("| 梯队 | TshuScore (95% CI) | 开口扣分 | 正文扣分 | 主导病灶 |")
                  print("| :---: | :---: | :---: | :---: | --- |")
                  print(f"| {cols[3]} | {cols[4]} | {cols[5]} | {cols[6]} | {cols[7]} |\n")
                  print("| CCI 长链绕口 | FMT 排版强迫 | ENU 报菜名 | TIC 套话抽动 | CVD 决断延迟 | HED 防御叠甲 |")
                  print("| :---: | :---: | :---: | :---: | :---: | :---: |")
                  print(f"| {cols[8]} | {cols[9]} | {cols[10]} | {cols[11]} | {cols[12]} | {cols[13]} |\n")

              if '最像天书的五条：' in text:
                  examples = text.split('最像天书的五条：', 1)[1].strip()
                  examples = re.sub(r'```[a-zA-Z0-9_-]*\s*', '`', examples)
                  print("<details>")
                  print("<summary>最像天书的五条（点击展开）</summary>\n")
                  print(examples)
                  print("\n</details>\n")
              PY
            fi
          done

      - name: Post Report Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_check/comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
