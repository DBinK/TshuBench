[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tshu"
version = "0.2.0"
description = "TshuBench · 天书榜：量化后训练过对齐导致的中文可读性退化"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jieba>=0.42.1",
    "loguru>=0.7",
    "markdown-it-py>=4.3.0",
    "pydantic>=2.14.3",
    "rich>=13.7",
    "typer>=0.29.1",
]

[project.scripts]
tshu = "tshu.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tshu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
