[project]
name = "tshubench"
version = "0.1.0"
description = "TshuBench · 天书榜：量化后训练过对齐导致的中文可读性退化"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
